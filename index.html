<style id="spain-theme">
:root{
  --spain-red:#c60b1e;
  --spain-yellow:#ffc400;
  --sand:#fff8e8;
  --terracotta:#b94b2b;
  --ink:#3a2a25;
}
body{
  background:
    radial-gradient(circle at 15% 8%, rgba(255,196,0,.20) 0 70px, transparent 71px),
    radial-gradient(circle at 88% 92%, rgba(198,11,30,.10) 0 100px, transparent 101px),
    linear-gradient(135deg,#fffdf8 0%,var(--sand) 100%);
  color:var(--ink);
}
body:before{
  content:"";
  display:block;
  height:8px;
  background:linear-gradient(to right,var(--spain-red) 0 28%,var(--spain-yellow) 28% 72%,var(--spain-red) 72% 100%);
}
.container{
  max-width:760px;
}
header{
  position:relative;
  overflow:hidden;
  border-radius:0 0 24px 24px;
  background:linear-gradient(135deg,var(--spain-red),#a50718);
  color:white;
  padding:24px 20px 22px;
  box-shadow:0 8px 24px rgba(120,20,20,.18);
}
header:after{
  content:"☀";
  position:absolute;
  right:18px;
  top:-8px;
  font-size:82px;
  line-height:1;
  color:rgba(255,196,0,.22);
}
header h1, header p{position:relative;z-index:1}
h1{
  letter-spacing:.03em;
}
h1:before{
  content:"🇪🇸 ";
}
.card{
  border:2px solid rgba(198,11,30,.12);
  border-radius:22px;
  background:rgba(255,255,255,.96);
  box-shadow:0 10px 28px rgba(70,35,20,.10);
}
button,.btn{
  border-radius:14px;
  border:0;
  transition:transform .12s ease,box-shadow .12s ease;
}
button:active,.btn:active{
  transform:translateY(1px);
}
button.primary,.btn.primary,#answerBtn{
  background:linear-gradient(135deg,var(--spain-red),#a50718) !important;
  color:#fff !important;
  box-shadow:0 5px 12px rgba(198,11,30,.22);
}
button.secondary,.btn.secondary{
  background:#fff4bf !important;
  color:#7b2d1f !important;
  border:1px solid #f0c83e;
}
select{
  border:2px solid #e7b91d !important;
  border-radius:12px !important;
  background:#fffdf4 !important;
}
.level-title,.section-title{
  color:var(--spain-red);
}
.badge{
  background:var(--spain-yellow);
  color:#5b351d;
}
#answer{
  border-left:5px solid var(--spain-yellow);
  background:#fffaf0;
}
</style>


<style id="fixed-card-actions">
/* カードをめくっても操作ボタンの位置が上下しないよう固定 */
.card{
  display:flex;
  flex-direction:column;
}
.card .card-actions,
.card .actions,
.card .buttons,
#actions{
  min-height:58px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}
</style>


<style id="stable-card-layout">
/* 問題文の長さに関係なく、カードと操作ボタンの位置を固定 */
.card{
  position:relative !important;
  box-sizing:border-box !important;
  height:430px !important;
  min-height:430px !important;
  padding:16px 16px 88px !important;
  overflow:hidden !important;
}
.card > .ja{
  min-height:82px;
  max-height:115px;
  overflow:auto;
  box-sizing:border-box;
}
.card > #answer{
  min-height:115px;
  max-height:145px;
  overflow:auto;
  box-sizing:border-box;
}
.card > .row:last-child{
  position:absolute !important;
  left:16px !important;
  right:16px !important;
  bottom:16px !important;
  margin:0 !important;
  height:56px !important;
  display:flex !important;
  align-items:center !important;
}
.card > .row:last-child button{
  width:100% !important;
  height:52px !important;
  flex:1 1 auto !important;
}
#answer{
  overflow:auto !important;
}
#replay{
  margin-top:10px;
}
@media (max-width:600px){
  .card{
    height:430px !important;
    min-height:430px !important;
  }
}
</style>


<style id="weak-mode-correct">

  box-shadow:0 0 0 3px rgba(255,196,0,.25),0 5px 14px rgba(198,11,30,.28) !important;

}

</head><body><div class="wrap"><div class="titlebar"><h1>スペイン旅行フレーズ</h1><span class="app-version">v1.3</span></div>

}
function updateInfo(){

function getWeak(){try{return JSON.parse(localStorage.getItem(weakKey)||'[]')}catch(e){return[]}}
function setWeak(a){localStorage.setItem(weakKey,JSON.stringify(a))}

function shuffle(a){
  let arr=[...a];
  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function buildPool(onlyWeak=false){
  let l=level.value,c=cat.value;
  pool=data.filter(x=>x.level===l&&(!c||x.cat===c));
  if(onlyWeak){
    let w=getWeak();
    pool=pool.filter(x=>w.includes(x.ja));
  }
  queue=shuffle(pool);
  termFinished=false;
  termNo++;
  updateProgress();
}

function updateProgress(){
  if(!pool.length){
    progress.textContent=weakOnly?'苦手カード：0件':'該当カード：0件';
    return;
  }
  let done=pool.length-queue.length;
  progress.textContent=`ターム ${termNo}　${done} / ${pool.length}`;
}

  const modal=document.getElementById('explanationModal'); if(modal)modal.classList.add('hidden'); document.body.style.overflow='';
  if(!pool.length){
    ja.textContent=weakOnly?'この条件で□苦手登録されたカードはありません。':'カードがありません。';
    answer.classList.add('hidden');
    reveal.textContent='答えを見る';
    progress.textContent='';
    return;
  }

  if(!queue.length){
    termFinished=true;
    ja.textContent=`ターム ${termNo} が終了しました。`;
    es.textContent='';
    kana.textContent='';
    answer.classList.add('hidden');
    reveal.textContent='次のターム';
    updateFavButton();
    progress.textContent=`ターム ${termNo} 完了　全${pool.length}件`;
    return;
  }

  current=queue.shift();
  ja.textContent=current.ja;
  es.textContent=current.es;
  kana.textContent=current.kana;
  const chunks=chunksForPhrase(current);
  ja.textContent=current.ja;
  document.getElementById('esUnderline').innerHTML=underlineHtml(chunks.es);
  document.getElementById('explanation').innerHTML=explanationHtml(current);
  document.getElementById('tagL').textContent=labels[current.level];
  document.getElementById('tagC').textContent=current.cat;
  answer.classList.add('hidden');
  reveal.textContent='答えを見る';
  updateFavButton();
  updateProgress();
}

function speak(){
  if(!current||!window.speechSynthesis)return;
  speechSynthesis.cancel();
  let u=new SpeechSynthesisUtterance(current.es);
  u.lang='es-ES';
  u.rate=.48;
  speechSynthesis.speak(u);
}

function updateWeakButton(){
  const b=document.getElementById('weak');
  if(!b)return;
  b.classList.toggle('weak-active',weakOnly);
  b.setAttribute('aria-pressed',weakOnly?'true':'false');
  b.textContent=weakOnly?'■ 苦手だけ（選択中）':'□ 苦手だけ';
}
function updateFavButton(){
  const b=document.getElementById('fav');
  if(!b)return;
  const marked=!!(current && getWeak().includes(current.ja));
  b.textContent=marked?'■ 苦手です':'□ 苦手です';
  b.classList.toggle('weak-marked',marked);
  b.setAttribute('aria-pressed',marked?'true':'false');
}

function start(only=false){
  weakOnly=only;
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  buildPool(only);
  updateWeakButton();
  next();
}

level.onchange=()=>{cats();reset();updateWeakButton();};
cat.onchange=()=>{updateInfo();reset();updateWeakButton();};

function reset(){
  current=null;
  pool=[];
  queue=[];
  termNo=0;
  termFinished=false;
  answer.classList.add('hidden');
  reveal.textContent='答えを見る';
  progress.textContent='';
}

document.getElementById('start').onclick=()=>start(weakOnly);
document.getElementById('replay').onclick=()=>speak();
const explanationModal=document.getElementById('explanationModal');
function openExplanation(){
  if(!current)return;
  document.getElementById('explanationModalPhrase').textContent=current.es+'　—　'+current.ja;
  document.getElementById('explanationModalBody').innerHTML=document.getElementById('explanation').innerHTML;
  explanationModal.classList.remove('hidden');
  document.body.style.overflow='hidden';
}
function closeExplanation(){
  explanationModal.classList.add('hidden');
  document.body.style.overflow='';
  document.getElementById('openExplanation').focus();
}
document.getElementById('openExplanation').onclick=openExplanation;
document.getElementById('closeExplanationBottom').onclick=closeExplanation;
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!explanationModal.classList.contains('hidden'))closeExplanation();});

document.getElementById('weak').onclick=(e)=>{
  e.preventDefault(); e.stopPropagation();
  weakOnly=!weakOnly; updateWeakButton();
  updateWeakButton();
};
document.getElementById('exitQuiz').onclick=()=>{
  document.getElementById('explanationModal').classList.add('hidden'); document.body.style.overflow='';
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('setupScreen').classList.remove('hidden');
  reset();
};

reveal.onclick=()=>{
  if(termFinished){
    buildPool(weakOnly);
    next();
    return;
  }
  if(answer.classList.contains('hidden')){
    answer.classList.remove('hidden');
    const chunks=chunksForPhrase(current);
    ja.innerHTML=underlineLargeHtml(chunks.ja,chunks.jaSuffix);
    reveal.textContent=queue.length===0?'次のターム':'次のカード';
    speak();
  }else{
    next();
  }
};

fav.onclick=()=>{
  if(!current)return;
  let w=getWeak();
  if(w.includes(current.ja))w=w.filter(x=>x!==current.ja);
  else w.push(current.ja);
  setWeak(w);
  updateFavButton();
};

cats();
updateWeakButton();
</script></body></html>
